<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Germany 2026 Kader Builder</title>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* ─── DESIGN TOKENS ─── */
    :root {
      --bg:         #000000;
      --bg-1:       #111111;
      --bg-2:       #1c1c1e;
      --bg-3:       #2c2c2e;
      --border:     rgba(255,255,255,0.09);
      --border-md:  rgba(255,255,255,0.18);
      --text:       #f5f5f7;
      --text-2:     rgba(245,245,247,0.6);
      --text-3:     rgba(245,245,247,0.32);
      --red:        #c8102e;
      --red-dim:    rgba(200,16,46,0.18);
      --gold:       #cfb078;
      --gold-dim:   rgba(207,176,120,0.15);
      --green:      #34c759;
      --green-dim:  rgba(52,199,89,0.15);
      --blue:       #0a84ff;
      --blue-dim:   rgba(10,132,255,0.15);
      --purple:     #bf5af2;
      --purple-dim: rgba(191,90,242,0.15);
      --r:          12px;
      --r-sm:       8px;
      --r-xs:       5px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    header {
      background: #000;
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-dfb-logo {
      height: 42px;
      width: auto;
      flex-shrink: 0;
      object-fit: contain;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .header-title span { color: var(--gold); }
    .header-sub {
      font-size: 0.72rem;
      color: var(--text-3);
      margin-top: 1px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .header-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--gold);
      background: var(--gold-dim);
      border: 1px solid rgba(207,176,120,0.25);
      padding: 4px 12px;
      border-radius: 100px;
      letter-spacing: 0.03em;
    }

    /* ─── APP LAYOUT ─── */
    .app {
      display: flex;
      gap: 1px;
      height: calc(100vh - 64px);
      overflow: hidden;
    }

    /* ─── LEFT: PLAYER POOL ─── */
    .pool-panel {
      width: 288px;
      min-width: 260px;
      flex-shrink: 0;
      background: var(--bg-1);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pool-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .pool-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 10px;
    }
    .pool-search {
      width: 100%;
      padding: 8px 12px 8px 32px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.15s;
      position: relative;
    }
    .pool-search:focus { border-color: var(--border-md); }
    .pool-search::placeholder { color: var(--text-3); }
    .search-wrap { position: relative; }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      color: var(--text-3);
      pointer-events: none;
    }
    .pool-groups {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 16px;
    }
    .pool-groups::-webkit-scrollbar { width: 3px; }
    .pool-groups::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 3px; }

    /* position group */
    .pos-group { margin: 0 0 2px; }
    .pos-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .pos-group-header:hover { background: var(--bg-2); }
    .pos-group-left { display: flex; align-items: center; gap: 8px; }
    .pos-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pos-GK  .pos-dot { background: var(--blue); }
    .pos-DEF .pos-dot { background: var(--green); }
    .pos-MID .pos-dot { background: var(--purple); }
    .pos-FWD .pos-dot { background: var(--red); }
    .pos-group-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-2);
    }
    .pos-count {
      font-size: 0.68rem;
      color: var(--text-3);
      margin-left: 4px;
    }
    .pos-chevron {
      font-size: 0.65rem;
      color: var(--text-3);
      transition: transform 0.2s;
    }
    .pos-group-header.open .pos-chevron { transform: rotate(180deg); }
    .pos-group-body {
      display: none;
      padding: 2px 8px 4px;
    }
    .pos-group-body.open { display: block; }

    /* player card in pool */
    .player-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      cursor: grab;
      transition: background 0.1s;
      border: 1px solid transparent;
      margin-bottom: 2px;
    }
    .player-card:hover { background: var(--bg-2); border-color: var(--border); }
    .player-card:active { cursor: grabbing; }
    .player-card.used {
      opacity: 0.28;
      pointer-events: none;
    }
    .club-logo {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      object-fit: contain;
      flex-shrink: 0;
      background: var(--bg-3);
    }
    .club-logo-fallback {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--bg-3);
      color: var(--text-2);
    }
    .player-info { flex: 1; min-width: 0; }
    .player-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .player-club-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }
    .player-club {
      font-size: 0.62rem;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .inline-logo {
      width: 14px;
      height: 14px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 2px;
      background: transparent;
      opacity: 0.75;
    }
    .inline-logo-fb {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.38rem;
      font-weight: 800;
      background: var(--bg-3);
      color: var(--text-3);
    }
    .pos-pill {
      flex-shrink: 0;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 100px;
      letter-spacing: 0.03em;
    }
    .pill-GK  { background: var(--blue-dim);   color: var(--blue); }
    .pill-DEF { background: var(--green-dim);  color: var(--green); }
    .pill-MID { background: var(--purple-dim); color: var(--purple); }
    .pill-FWD { background: var(--red-dim);    color: #ff453a; }

    /* ─── PLAYER PHOTO ─── */
    .player-photo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      flex-shrink: 0;
      background: var(--bg-3);
      border: 1px solid var(--border);
    }
    .player-photo-fb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--bg-3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-2);
    }
    .slot-photo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      flex-shrink: 0;
      background: var(--bg-3);
    }
    .slot-photo-fb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--bg-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      font-weight: 700;
      color: var(--text-2);
    }

    /* ─── RIGHT: BUILDER PANEL ─── */
    .builder-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    #export-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }
    #export-area::-webkit-scrollbar { width: 4px; }
    #export-area::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 4px; }

    /* section header */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .counter-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 100px;
      border: 1px solid var(--border);
      color: var(--text-2);
    }
    .counter-badge.complete { border-color: rgba(52,199,89,0.4); color: var(--green); }
    .counter-badge.warn     { border-color: rgba(255,165,0,0.4); color: #ff9f0a; }

    /* ─── KADER GRID ─── */
    .kader-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
      gap: 6px;
      margin-bottom: 32px;
    }

    /* slot */
    .squad-slot {
      min-height: 68px;
      border-radius: var(--r-sm);
      border: 1px dashed var(--border);
      background: var(--bg-1);
      display: flex;
      flex-direction: column;
      padding: 8px;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
      cursor: default;
    }
    .squad-slot.drag-over {
      border-color: var(--border-md);
      border-style: solid;
      background: var(--bg-2);
    }
    .squad-slot.filled {
      border-style: solid;
      border-color: var(--border);
      background: var(--bg-2);
      cursor: grab;
    }
    .squad-slot.filled:active { cursor: grabbing; }
    .slot-pos-label {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    .slot-body {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 1;
    }
    .slot-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      border-radius: 3px;
      background: var(--bg-3);
      flex-shrink: 0;
    }
    .slot-logo-fb {
      width: 22px;
      height: 22px;
      border-radius: 3px;
      background: var(--bg-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.5rem;
      font-weight: 800;
      color: var(--text-3);
      flex-shrink: 0;
    }
    .slot-info .sname {
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text);
    }
    .slot-info .sclub {
      font-size: 0.6rem;
      color: var(--text-3);
      margin-top: 1px;
    }
    .slot-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, color 0.1s;
      line-height: 1;
    }
    .slot-remove:hover { background: var(--bg-3); color: #ff453a; }

    /* ─── XI SECTION ─── */
    .xi-wrapper { margin-bottom: 8px; }

    .pitch {
      background:
        linear-gradient(180deg, #1a4d2b 0%, #1e5c30 50%, #1a4d2b 100%);
      border-radius: var(--r);
      padding: 20px 16px 24px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* Pitch line decorations */
    .pitch::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 8%;
      right: 8%;
      height: 1px;
      background: rgba(255,255,255,0.1);
      transform: translateY(-50%);
    }
    .pitch::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 64px;
      height: 64px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .pitch-line-top {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      height: 48px;
      border: 1px solid rgba(255,255,255,0.1);
      border-top: none;
      border-radius: 0 0 8px 8px;
    }
    .pitch-line-bot {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      height: 48px;
      border: 1px solid rgba(255,255,255,0.1);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
    }

    /* formation row */
    .xi-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }
    .xi-row:last-child { margin-bottom: 0; }

    /* xi slot */
    .xi-slot {
      width: 90px;
      min-height: 76px;
      border-radius: var(--r-sm);
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7px 6px;
      transition: all 0.15s;
      position: relative;
      cursor: default;
    }
    .xi-slot .slot-pos-label {
      text-align: center;
      width: 100%;
    }
    .slot-drop-hint {
      font-size: 0.55rem;
      color: rgba(255,255,255,0.28);
      margin-top: 4px;
      letter-spacing: 0.02em;
      text-align: center;
    }
    .xi-slot.drop-ready {
      border-color: rgba(207,176,120,0.5);
      background: rgba(207,176,120,0.07);
      box-shadow: 0 0 0 1px rgba(207,176,120,0.25);
    }
    .xi-slot.drag-over {
      border-color: var(--gold);
      background: rgba(207,176,120,0.18);
      box-shadow: 0 0 0 2px var(--gold);
    }
    .xi-slot.filled {
      border-color: rgba(52,199,89,0.5);
      background: rgba(52,199,89,0.08);
    }
    .xi-hint {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.35);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }
    .xi-slot .slot-body {
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }
    .xi-slot .slot-info .sname {
      font-size: 0.68rem;
      text-align: center;
    }
    .xi-slot .slot-info .sclub {
      display: none; /* keep pitch clean */
    }

    /* formation picker */
    .formation-picker {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .formation-btn {
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: all 0.15s;
    }
    .formation-btn:hover {
      border-color: var(--border-md);
      color: var(--text-2);
    }
    .formation-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(207,176,120,0.08);
    }

    /* ─── CONTROLS BAR ─── */
    .controls-bar {
      padding: 14px 28px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .btn {
      padding: 8px 16px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: var(--text-2);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
      letter-spacing: 0.01em;
    }
    .btn:hover { background: var(--bg-3); color: var(--text); border-color: var(--border-md); }
    .btn-primary {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .btn-primary:hover { background: #a00c24; border-color: #a00c24; color: #fff; }
    .btn-gold {
      background: var(--gold-dim);
      border-color: rgba(207,176,120,0.3);
      color: var(--gold);
    }
    .btn-gold:hover { background: rgba(207,176,120,0.25); color: var(--gold); }
    .sep { flex: 1; }
    .status-msg {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--green);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .status-msg.visible { opacity: 1; }
    .status-msg.warn { color: #ff9f0a; }

    /* ─── NAME INPUT ─── */
    .name-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .name-input {
      flex: 1;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 9px 14px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .name-input:focus { border-color: var(--border-md); }
    .name-input::placeholder { color: var(--text-3); font-weight: 400; }
    .name-display {
      font-size: 0.72rem;
      color: var(--text-3);
      white-space: nowrap;
    }

    /* ─── DRAG STATES ─── */
    .sortable-ghost { opacity: 0.25; }
    .sortable-chosen { transform: scale(1.02); box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 999; }

    /* ─── MOBILE TAB BAR (hidden on desktop) ─── */
    .mobile-tabs { display: none; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      /* Header */
      header { padding: 0 16px; height: 52px; }
      .header-dfb-logo { height: 32px; }
      .header-badge { display: none; }
      .header-title { font-size: 0.85rem; }

      /* App: single column, full height minus header+tabbar */
      .app {
        flex-direction: column;
        height: calc(100dvh - 52px - 56px);
        overflow: hidden;
        gap: 0;
      }

      /* Pool panel: full width, full height, initially visible */
      .pool-panel {
        width: 100%;
        height: 100%;
        border-right: none;
        border-bottom: none;
        flex-shrink: 0;
      }

      /* Builder panel: full width, full height, initially hidden */
      .builder-panel {
        width: 100%;
        height: 100%;
        flex-shrink: 0;
        display: none;
      }
      .builder-panel.mobile-active { display: flex; }

      #export-area {
        overflow-y: auto;
        padding: 16px;
        -webkit-overflow-scrolling: touch;
      }

      /* Controls bar compact */
      .controls-bar {
        padding: 10px 16px;
        gap: 6px;
      }
      .btn { padding: 7px 12px; font-size: 0.72rem; }
      .status-msg { display: none; }

      /* Kader grid tighter */
      .kader-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 5px;
        margin-bottom: 24px;
      }
      #kader-section { margin-bottom: 0; }

      /* XI slots: flex to fill row width naturally */
      .xi-slot {
        flex: 1;
        min-width: 48px;
        max-width: 80px;
        width: auto;
        min-height: 64px;
        padding: 5px 3px;
      }
      .xi-slot .slot-info .sname { font-size: 0.6rem; }

  const entries = Object.entries(PLAYER_WIKI_NAMES);
  // Fire all requests in parallel — Wikipedia allows it (200 req/s limit)
  await Promise.allSettled(entries.map(([pid, name]) => _fetchPhoto(pid, name)));
}

async function _fetchPhoto(pid, name) {
  try {
    const r = await fetch(
      'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(name),
      { headers: { 'Api-User-Agent': 'Kader2026/1.0' } }
    );
    if (!r.ok) return;
    const url = (await r.json()).thumbnail?.source;
    if (!url) return;
    PLAYER_PHOTOS[pid] = url;
    const card = document.querySelector('.player-card[data-pid="' + pid + '"]');
    if (!card) return;
    const old = card.querySelector('.player-photo, .player-photo-fb');
    if (!old) return;
    const img = new Image(36, 36);
    img.className = 'player-photo';
    img.src = url;
    img.onerror = () => {
      const fb = document.createElement('div');
      fb.className = 'player-photo-fb';
      fb.style.cssText = 'width:36px;height:36px';
      fb.textContent = clubInitials(PLAYERS.find(p => p.id === pid)?.club || '');
      img.replaceWith(fb);
    };
    old.replaceWith(img);
  } catch(e) {}
}

// Unique index for each logo → safe onerror without special chars in attr
const _logoRegistry = {};
let _logoIdx = 0;

function registerLogo(club, size, fbCls) {
  const key = 'lg' + (_logoIdx++);
  _logoRegistry[key] = { club, size, fbCls };
  return key;
}

window._logoError = function(key, img) {
  const { club, size, fbCls } = _logoRegistry[key] || {};
  if (!club) return;
  const d = document.createElement('div');
  d.className = fbCls;
  d.style.cssText = `width:${size}px;height:${size}px`;
  d.textContent = clubInitials(club);
  img.replaceWith(d);
};

function makeLogo(club, size = 22, cls = 'slot-logo') {
  const url = logoUrl(club);
  if (url) {
    const key = registerLogo(club, size, 'slot-logo-fb');
    return `<img class="${cls}" src="${url}" alt=""
      onerror="_logoError('${key}',this)"
      width="${size}" height="${size}"
      style="border-radius:3px;background:var(--bg-3)" />`;
  }
  return `<div class="slot-logo-fb" style="width:${size}px;height:${size}px">${clubInitials(club)}</div>`;
}

  const url = logoUrl(club);

  }
  return `<div class="club-logo-fallback">${clubInitials(club)}</div>`;
}

}

════════════════════════════════════════════ */
const GROUP_META = [
  { key:'GK',  label:'Goalkeepers' },
  { key:'DEF', label:'Defenders'   },
  { key:'MID', label:'Midfielders' },
  { key:'FWD', label:'Forwards'    },
];

function buildPool() {
  const container = document.getElementById('pool-container');
  container.innerHTML = '';

  GROUP_META.forEach(g => {
    const players = PLAYERS.filter(p => p.group === g.key);
    const wrap = document.createElement('div');
    wrap.className = `pos-group pos-${g.key}`;
    wrap.innerHTML = `
      <div class="pos-group-header open" data-group="${g.key}" onclick="toggleGroup(this)">
        <div class="pos-group-left">
          <div class="pos-dot"></div>
          <span class="pos-group-name">${g.label}</span>
          <span class="pos-count">${players.length}</span>
        </div>
        <span class="pos-chevron">▾</span>
      </div>
      <div class="pos-group-body open" id="pool-${g.key}"></div>
    `;
    container.appendChild(wrap);

    const body = wrap.querySelector('.pos-group-body');
    players.forEach(p => {
      const card = document.createElement('div');
      card.className = 'player-card';
      card.dataset.pid   = p.id;
      card.dataset.group = g.key;
      card.draggable = true;
      card.innerHTML = `
        ${makePlayerPhoto(p.id, p.club, 36, 'player-photo')}
        <div class="player-info">
          <div class="player-name">${p.name}</div>
          <div class="player-club-row">
            ${makeInlineLogo(p.club)}
            <span class="player-club">${p.club}</span>
          </div>
        </div>
        <span class="pos-pill pill-${g.key}">${p.pos.split('/')[0].trim()}</span>
      `;
      card.addEventListener('dragstart', onPoolDragStart);
      body.appendChild(card);
    });
  });
}

function toggleGroup(header) {
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('pool-search').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    document.querySelectorAll('.player-card').forEach(c => {
      c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
});

/* ════════════════════════════════════════════
   BUILD KADER GRID
════════════════════════════════════════════ */
function buildKaderGrid() {
  const grid = document.getElementById('kader-grid');
  grid.innerHTML = '';
  KADER_SLOTS.forEach(slot => {
    const el = document.createElement('div');
    el.className   = 'squad-slot';
    el.id          = `slot-${slot.id}`;
    el.dataset.slotId = slot.id;
    attachSlotEvents(el, slot.id, 'kader');
    grid.appendChild(el);
    renderKaderSlot(slot.id);
  });
}

function renderKaderSlot(slotId) {
  const el   = document.getElementById(`slot-${slotId}`);
  if (!el) return;
  const pid  = kaderData[slotId];
  const slot = KADER_SLOTS.find(s => s.id === slotId);

  if (!pid) {
    el.className = 'squad-slot';
    el.innerHTML = `<div class="slot-pos-label">${slot.l}</div>`;
  } else {
    const p = getPlayer(pid);
    el.className = 'squad-slot filled';
    el.innerHTML = `
      <div class="slot-pos-label">${slot.l}</div>
      <div class="slot-body">
        ${makePlayerPhoto(p.id, p.club, 28, 'slot-photo')}
        <div class="slot-info">
          <div class="sname">${p.name}</div>
          <div class="sclub">${p.pos}</div>
        </div>
      </div>
      <button class="slot-remove" onclick="removeFromKader('${slotId}')">✕</button>
    `;
    const inner = el.querySelector('.slot-body');
    inner.draggable = true;
    inner.dataset.pid = pid;
    inner.dataset.fromKader = slotId;
    inner.addEventListener('dragstart', onKaderCardDragStart);
  }
  attachSlotEvents(el, slotId, 'kader');
}

/* ════════════════════════════════════════════
   BUILD XI
════════════════════════════════════════════ */
function buildFormationPicker() {
  const picker = document.getElementById('formation-picker');
  picker.innerHTML = '';
  Object.entries(FORMATIONS).forEach(([key, f]) => {
    const btn = document.createElement('button');
    btn.className = 'formation-btn' + (key === currentFormation ? ' active' : '');
    btn.dataset.formation = key;
    btn.textContent = f.label;
    btn.onclick = () => setFormation(key);
    picker.appendChild(btn);
  });
}

function setFormation(key) {
  currentFormation = key;
  xiData.fill(null);
  buildXI();
  updatePoolUsed();
  updateBadges();
  document.querySelectorAll('.formation-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.formation === key)
  );
  showStatus('Formation: ' + FORMATIONS[key].label);
}

function buildXI() {
  const pitch = document.getElementById('xi-pitch');
  pitch.querySelectorAll('.xi-row').forEach(r => r.remove());
  const formation = FORMATIONS[currentFormation];
  let idx = 0;
  formation.rows.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'xi-row';
    row.forEach(pos => {
      const slot = document.createElement('div');
      slot.className = 'xi-slot';
      slot.dataset.pos = pos;
      slot.dataset.xiIndex = idx;
      slot.innerHTML = `<div class="slot-pos-label">${pos}</div><div class="slot-drop-hint">drag here</div>`;
      attachSlotEvents(slot, idx, 'xi');
      rowEl.appendChild(slot);
      idx++;
    });
    pitch.appendChild(rowEl);
  });
  for (let i = 0; i < XI_SIZE; i++) renderXISlot(i);
}

function renderXISlot(idx) {
  const slot = document.querySelector(`.xi-slot[data-xi-index="${idx}"]`);
  if (!slot) return;
  const posLabel = slot.dataset.pos;
  const pid      = xiData[idx];

  if (!pid) {
    slot.className = 'xi-slot';
    slot.innerHTML = `<div class="slot-pos-label">${posLabel}</div><div class="slot-drop-hint">drag here</div>`;
  } else {
    const p = getPlayer(pid);
    slot.className = 'xi-slot filled';
    slot.innerHTML = `
      <div class="slot-pos-label">${posLabel}</div>
      <div class="slot-body">
        ${makePlayerPhoto(p.id, p.club, 28, 'slot-photo')}
        <div class="slot-info"><div class="sname">${p.name}</div></div>
      </div>
      <button class="slot-remove" onclick="removeFromXI(${idx})">✕</button>
    `;
    const inner = slot.querySelector('.slot-body');
    inner.draggable = true;
    inner.dataset.pid    = pid;
    inner.dataset.fromXi = idx;
    inner.addEventListener('dragstart', onXICardDragStart);
  }
  attachSlotEvents(slot, idx, 'xi');
}

/* ════════════════════════════════════════════
   EVENT ATTACHMENT
════════════════════════════════════════════ */
function attachSlotEvents(el, target, type) {
  el.addEventListener('dragover',  e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => {
    el.classList.remove('drag-over');
    if (type === 'kader') onKaderDrop(e, target);
    else onXIDrop(e, target);
  });
}

/* ════════════════════════════════════════════
   DRAG & DROP
════════════════════════════════════════════ */
let dragPayload = null;

function onPoolDragStart(e) {
  const pid = e.currentTarget.dataset.pid;
  if (isUsed(pid)) { e.preventDefault(); return; }
  dragPayload = { pid, fromPool: true };
  e.dataTransfer.effectAllowed = 'move';
}
function onKaderCardDragStart(e) {
  const c = e.currentTarget;
  dragPayload = { pid: c.dataset.pid, fromKader: c.dataset.fromKader };
  e.dataTransfer.effectAllowed = 'move';
  highlightEmptyXISlots(true);
  e.currentTarget.closest('.squad-slot')?.addEventListener('dragend', () => highlightEmptyXISlots(false), { once: true });
}

function highlightEmptyXISlots(on) {
  document.querySelectorAll('.xi-slot:not(.filled)').forEach(s => {
    s.classList.toggle('drop-ready', on);
  });
}
function onXICardDragStart(e) {
  const c = e.currentTarget;
  dragPayload = { pid: c.dataset.pid, fromXI: parseInt(c.dataset.fromXi) };
  e.dataTransfer.effectAllowed = 'move';
}

function onKaderDrop(e, slotId) {
  e.preventDefault();
  if (!dragPayload) return;
  const { pid, fromPool, fromKader } = dragPayload;
  const existing = kaderData[slotId];

  if (fromPool && isUsed(pid))          { showStatus('Already in squad!', 'warn'); dragPayload = null; return; }
  if (fromPool && !existing && usedInKader().length >= 29) { showStatus('Kader is full (29/29)!', 'warn'); dragPayload = null; return; }

  if (existing && existing !== pid) {
    if (fromKader) { kaderData[fromKader] = existing; renderKaderSlot(fromKader); }
    else           { showStatus('Slot occupied!', 'warn'); dragPayload = null; return; }
  } else if (fromKader) {
    kaderData[fromKader] = null; renderKaderSlot(fromKader);
  }

  kaderData[slotId] = pid;
  renderKaderSlot(slotId);
  updatePoolUsed();
  updateBadges();
  dragPayload = null;
}

function onXIDrop(e, idx) {
  e.preventDefault();
  if (!dragPayload) return;
  const { pid, fromPool, fromKader, fromXI } = dragPayload;

  if (fromPool) { showStatus('Add to Kader first!', 'warn'); dragPayload = null; return; }
  if (fromKader && !usedInKader().includes(pid)) { showStatus('Must be in Kader!', 'warn'); dragPayload = null; return; }

  const existingTarget = xiData[idx];
  const alreadyXiIdx  = xiData.indexOf(pid);

  if (alreadyXiIdx !== -1 && alreadyXiIdx !== idx) {
    xiData[alreadyXiIdx] = existingTarget;
    renderXISlot(alreadyXiIdx);
  } else if (fromXI !== undefined && fromXI !== idx) {
    xiData[fromXI] = existingTarget;
    renderXISlot(fromXI);
  }

  xiData[idx] = pid;
  renderXISlot(idx);
  updatePoolUsed();
  updateBadges();
  if (usedInXI().length === 11) showStatus('Starting XI complete! 🎉');
  dragPayload = null;
}

/* ════════════════════════════════════════════
   REMOVE
════════════════════════════════════════════ */
function removeFromKader(slotId) {
  const pid = kaderData[slotId];
  if (!pid) return;
  const xi = xiData.indexOf(pid);
  if (xi !== -1) { xiData[xi] = null; renderXISlot(xi); }
  kaderData[slotId] = null;
  renderKaderSlot(slotId);
  updatePoolUsed();
  updateBadges();
}
function removeFromXI(idx) {
  xiData[idx] = null;
  renderXISlot(idx);
  updatePoolUsed();
  updateBadges();
}

/* ════════════════════════════════════════════
   RESET
════════════════════════════════════════════ */
function resetSquad() {
  KADER_SLOTS.forEach(s => { kaderData[s.id] = null; renderKaderSlot(s.id); });
  xiData.fill(null);
  for (let i = 0; i < XI_SIZE; i++) renderXISlot(i);
  updatePoolUsed();
  updateBadges();
  showStatus('Kader reset.');
}
function clearXI() {
  xiData.fill(null);
  for (let i = 0; i < XI_SIZE; i++) renderXISlot(i);
  updatePoolUsed();
  updateBadges();
  showStatus('Starting XI cleared.');
}

/* ════════════════════════════════════════════
   EXPORT
════════════════════════════════════════════ */
function captureFullExport() {
  const el = document.getElementById('export-area');
  const prev = { overflow: el.style.overflow, height: el.style.height, maxHeight: el.style.maxHeight };
  el.style.overflow = 'visible';
  el.style.height = el.scrollHeight + 'px';
  el.style.maxHeight = 'none';
  return html2canvas(el, {
    backgroundColor: '#000000',
    scale: 2,
    useCORS: true,
    allowTaint: true,
    logging: false,
    height: el.scrollHeight,
    windowHeight: el.scrollHeight,
  }).then(canvas => {
    el.style.overflow = prev.overflow;
    el.style.height = prev.height;
    el.style.maxHeight = prev.maxHeight;
    return canvas;
  });
}
function downloadPNG() {
  if (!usedInKader().length) { alert('Your Kader is empty!'); return; }
  const userName = document.getElementById('user-name').value.trim();
  captureFullExport().then(canvas => {
    const a = document.createElement('a');
    const slug = userName ? userName.replace(/\s+/g, '_') : 'My';
    a.download = `Germany_2026_${slug}_Kader.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
    showStatus('PNG saved ✓');
  });
}
function downloadPDF() {
  if (!usedInKader().length) { alert('Your Kader is empty!'); return; }
  captureFullExport().then(canvas => {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('landscape', 'mm', 'a4');
    pdf.setFillColor(0, 0, 0);
    pdf.rect(0, 0, 297, 210, 'F');
    const userName = document.getElementById('user-name').value.trim();
    const titleLine = userName ? `${userName}'s Germany 2026 Kader` : 'My Germany 2026 World Cup Kader';
    pdf.setFontSize(16);
    pdf.setTextColor(207, 176, 120);
    pdf.text(titleLine.toUpperCase(), 148.5, 12, { align: 'center' });
    pdf.setFontSize(8);
    pdf.setTextColor(120, 120, 120);
    pdf.text('FIFA World Cup 2026 · USA · Canada · Mexico', 148.5, 18, { align: 'center' });
    const imgData = canvas.toDataURL('image/png');
    const pW = 275, pH = (canvas.height / canvas.width) * pW;
    pdf.addImage(imgData, 'PNG', 11, 22, pW, Math.min(pH, 180));
    pdf.save('Germany_2026_MyKader.pdf');
    showStatus('PDF saved ✓');
  });
}

/* ════════════════════════════════════════════
   MOBILE TABS
════════════════════════════════════════════ */
function switchTab(tab) {
  if (window.innerWidth > 768) return;
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab)
  );
  const pool    = document.querySelector('.pool-panel');
  const builder = document.querySelector('.builder-panel');
  if (tab === 'pool') {
    pool.style.display    = '';
    builder.classList.remove('mobile-active');
  } else {
    pool.style.display    = 'none';
    builder.classList.add('mobile-active');
    const target = tab === 'kader'
      ? document.getElementById('kader-section')
      : document.getElementById('xi-section');
    if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  }
}

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
buildPool();
buildKaderGrid();
buildFormationPicker();
buildXI();
updateBadges();
loadPhotosAsync();
</script>
